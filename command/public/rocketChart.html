<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rocket Chart</title>
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;height:100%;background:#070a10;overflow:hidden}
#rocket-root{display:flex;flex-direction:column;height:100%;gap:6px;padding:6px;box-sizing:border-box}
.c{position:relative;flex:1;min-height:0;border-radius:14px;overflow:hidden;background:#10151f}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
</style>
</head>
<body><div id="rocket-root"></div>
<script src="js/rocketChart.js"></script>
</body>
</html>
