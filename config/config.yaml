trading:
  mode: "live"                   # live-only; paper mode has been removed. Gated by ALLOW_LIVE_TRADING=TRUE.
  base_currency: "USD"
  bankroll: 20.0                # conservative baseline (auto-scales to live balance in live mode)
  max_daily_loss_pct: 10.0      # circuit breaker: halt if daily loss exceeds this % of bankroll ($2 on $20)
  quarter_kelly_cap_pct: 15.0   # per-trade max risk (Kalshi), % of live balance; Polymarket uses its own cap
  max_exposure_pct: 50.0        # total open notional (per venue) cap, % of live balance — "don't burn the bankroll"
  polymarket_cap_pct: 1.0       # tighter per-trade Kelly cap
  polymarket_exposure_pct: 20.0  # total Polymarket open notional cap, % of live balance (frugal: PM never drunk-bets the bankroll)
  polymarket_max_contract_price: 0.60  # Polymarket hard price ceiling (60c): only enter cheap, never 70-90c
  min_ev_threshold: 0.02        # minimum expected-value edge (net of fees) before firing
  chase_guard_pct: 0.1          # don't buy a side that already moved >0.1% this window (anti-chase)
  entry_warmup_seconds: 90.0    # hard entry block: stay flat for the first 90s of a window
  take_profit_pct: 85.0         # auto-sell a position once it's up 85% (then re-enter if edge remains)
  certainty_all_in_pct: 50.0    # near-certain all-in: when the late-scalp fires at 93-97c with the
                                # model >=97% confident, size up to this % of the live balance
                                # (NOT 100% — a single tail loss must never wipe the bankroll)
  llm_gates: false              # false = skip Ollama+DeepSeek (they add ~2s/tick AND veto everything); deterministic gates keep safety

polymarket:
  gamma_api_url: "https://gamma-api.polymarket.com"
  min_order_shares: 5.0         # 5-share minimum order size
  taker_fee_scale: 0.07         # taker fee = 0.07 * p * (1 - p) per share
  maker_fee: 0.0
  timeframes: [300, 900]   # 5m (Polymarket) / 15m (Kalshi)

kalshi:
  base_url: "https://external-api.kalshi.com/trade-api/v2"
  demo_base_url: "https://external-api.demo.kalshi.co/trade-api/v2"
  ws_url: "wss://external-feeds.kalshi.com/trade-api/v2/external-feeds"
  rate_limit_balance_per_sec: 1.0
  market_ticker: "KXBTC15M"
  use_demo: false

connectors:
  coinbase:
    ws_url: "wss://ws-feed.exchange.coinbase.com"
    rolling_window_seconds: 60
  bybit:
    ws_url: "wss://stream.bybit.com/v5/public/linear"
    symbol: "BTCUSDT"
  deribit:
    rest_url: "https://www.deribit.com/api/v2"
    index: "btc_usd"

features:
  window_delta_weight: 6.0      # Window Delta weighted 5x-7x standard TA
  regime_lookback_seconds: 300
  book_imbalance_levels: 3
  vol_rv_iv_threshold: 1.0      # realized vol > implied vol -> amplifying
  funding_zscore_threshold: 2.0

strategies:
  late_scalp:
    enabled: true
    min_time_remaining: 10
    max_time_remaining: 30     # only the final 30s (near-certain + safe)
    min_prob: 0.93             # near-certain only (93-98c), NOT the 70-90c lock trap
    max_prob: 0.98
    min_window_delta_pct: 0.02
  market_maker:
    enabled: false   # disabled: its post-only maker orders rest unfilled on Kalshi and lock exposure
    min_time_remaining: 120
    levels: 1
    min_spread: 0.02
    refresh_seconds: 60
    spot_move_pct: 0.03
    min_edge: 0.02
  crowd_follow:
    enabled: false   # disabled: 0% win rate — buying the popular side is anti-predictive
    min_time_remaining: 180
    max_time_remaining: 300
    min_contract_price: 0.55
  iv_mispricing:
    enabled: true
    min_divergence: 0.02   # keep above the ~2-4% Kalshi taker fee so entries stay net-EV

ml:
  trailing_window: 200
  lgbm_num_leaves: 31
  lgbm_learning_rate: 0.05

news:
  enabled: true
  refresh_seconds: 300
  min_relevance: 0.15
  max_items_per_source: 20
  sentiment_backend: "lexicon"   # lexicon (offline) | transformer (HuggingFace)
  window: 200
  min_signals: 5
  downgrade_threshold: 0.45
  disable_threshold: 0.35
  promote_threshold: 0.55

ai:
  enabled: false   # no LLM token spend by default (offline fallback used)
  base_url: "https://api.deepseek.com/v1"   # ChatGPT: https://api.openai.com/v1
  model: "deepseek-chat"                    # ChatGPT: gpt-4o-mini

telegram:
  enabled: true

safety:
  trade_only_keys: true                   # MUST stay true: block any withdrawal
  kill_switch_file: "data/kill_switch.json"

database:
  path: "data/btc_edge.db"

web:
  host: "0.0.0.0"
  port: 8080

ollama:
  endpoint: "http://127.0.0.1:11434/api/chat"
  model: "qwen2.5-coder:7b-instruct-q4_K_M"
  num_ctx: 512
  num_predict: 3
  temperature: 0.0
  num_gpu: 99            # 99 = offload every layer to GPU
  keep_alive: "-1"       # -1 = keep resident forever; "0" = unload; or "5m"/"30s"
  timeout_seconds: 2.0   # hard cap per verdict (7B needs ~0.7-2.0s)

logging:
  level: "INFO"
